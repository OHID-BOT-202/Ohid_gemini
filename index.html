<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SimSimi Baby Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    .app {
      max-width: 500px;
      height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
      background: #050505;
      border-left: 1px solid #222;
      border-right: 1px solid #222;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px;
      background: #080808;
      border-bottom: 1px solid #00ff66;
      box-shadow: 0 0 15px #00ff6644;
    }

    .profile {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #00ff66;
      box-shadow: 0 0 12px #00ff66;
    }

    .bot-name {
      color: #00ff66;
      font-size: 19px;
      font-weight: bold;
    }

    .status {
      color: #aaa;
      font-size: 12px;
      margin-top: 4px;
    }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 18px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 82%;
      padding: 11px 14px;
      border-radius: 15px;
      line-height: 1.5;
      font-size: 15px;
      word-wrap: break-word;
    }

    .bot {
      align-self: flex-start;
      background: #061b0d;
      color: #00ff66;
      border: 1px solid #00ff66;
      border-bottom-left-radius: 3px;
      box-shadow: 0 0 8px #00ff6633;
    }

    .user {
      align-self: flex-end;
      background: #260606;
      color: #ff3333;
      border: 1px solid #ff2222;
      border-bottom-right-radius: 3px;
      box-shadow: 0 0 8px #ff222233;
    }

    .typing {
      display: none;
      align-self: flex-start;
      color: #00ff66;
      font-size: 13px;
      padding: 5px 10px;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #080808;
      border-top: 1px solid #222;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 1px solid #00ff66;
      border-radius: 25px;
      outline: none;
      background: #000;
      color: white;
      font-size: 15px;
    }

    #messageInput:focus {
      box-shadow: 0 0 10px #00ff6655;
    }

    #sendBtn {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      background: #ff2222;
      color: white;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 0 12px #ff2222;
    }

    #sendBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <img
        class="profile"
        src="https://i.ibb.co/G4sHV2cW/20260822-000544.jpg"
        alt="Bot Profile"
      >

      <div>
        <div class="bot-name">Baby SimSimi</div>
        <div class="status">Online • Auto Reply</div>
      </div>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="message bot">
        হ্যালো! আমি Baby SimSimi 🤖<br>
        আমাকে কিছু জিজ্ঞেস করো।
      </div>

      <div class="typing" id="typing">
        Baby SimSimi লিখছে...
      </div>
    </div>

    <form class="input-area" id="chatForm">
      <input
        type="text"
        id="messageInput"
        placeholder="মেসেজ লিখুন..."
        autocomplete="off"
        required
      >

      <button type="submit" id="sendBtn">➤</button>
    </form>

  </div>

  <script>
    const simsim = "https://simsimi.cyberbot.top";

    const chatForm = document.getElementById("chatForm");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const chatBox = document.getElementById("chatBox");
    const typing = document.getElementById("typing");

    function addMessage(text, type) {
      const message = document.createElement("div");
      message.className = "message " + type;
      message.textContent = text;

      chatBox.insertBefore(message, typing);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showTyping() {
      typing.style.display = "block";
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function hideTyping() {
      typing.style.display = "none";
    }

    async function sendMessage(text) {
      addMessage(text, "user");

      messageInput.value = "";
      sendBtn.disabled = true;
      showTyping();

      try {
        const apiUrl =
          simsim + "/simsimi?text=" + encodeURIComponent(text);

        const response = await fetch(apiUrl);

        if (!response.ok) {
          throw new Error("API Error");
        }

        const data = await response.json();

        hideTyping();

        const reply =
          data.success ||
          data.message ||
          data.response ||
          data.reply ||
          data.text ||
          "দুঃখিত, এখন উত্তর দিতে পারছি না।";

        addMessage(reply, "bot");

      } catch (error) {
        hideTyping();

        addMessage(
          "API কাজ করছে না। কিছুক্ষণ পরে আবার চেষ্টা করো।",
          "bot"
        );

        console.error("SimSimi Error:", error);

      } finally {
        sendBtn.disabled = false;
        messageInput.focus();
      }
    }

    chatForm.addEventListener("submit", function(event) {
      event.preventDefault();

      const text = messageInput.value.trim();

      if (text !== "") {
        sendMessage(text);
      }
    });
  </script>

</body>
</html>
