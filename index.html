
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ohid bby Ai</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#000;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.chat{
  width:100%;
  max-width:430px;
  height:100vh;
  max-height:750px;
  background:#050505;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  border:1px solid #00ff88;
  box-shadow:0 0 25px #00ff8840;
}

.header{
  background:#080808;
  color:white;
  padding:13px 15px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid #00ff88;
  box-shadow:0 0 15px #00ff8840;
}

.avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  background:#111;
  overflow:hidden;
  flex-shrink:0;
  border:2px solid #00ffff;
  box-shadow:0 0 12px #00ffff;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.header h3{
  margin:0;
  font-size:18px;
  color:#00ff88;
  text-shadow:0 0 8px #00ff88;
}

.header small{
  color:#00ffff;
  text-shadow:0 0 6px #00ffff;
}

.messages{
  flex:1;
  padding:15px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
  background:#050505;
}

.message{
  max-width:82%;
  padding:10px 13px;
  border-radius:12px;
  font-size:15px;
  line-height:1.5;
  word-wrap:break-word;
  white-space:pre-wrap;
}

.bot{
  align-self:flex-start;
  background:#062b1d;
  color:#fff;
  border:1px solid #00ff88;
  border-top-left-radius:3px;
  box-shadow:0 0 10px #00ff8840;
}

.user{
  align-self:flex-end;
  background:#171717;
  color:#fff;
  border:1px solid #ff00ff;
  border-top-right-radius:3px;
  box-shadow:0 0 10px #ff00ff40;
}

.time{
  display:block;
  font-size:10px;
  color:#aaa;
  text-align:right;
  margin-top:4px;
}

.bot .time{
  color:#00ff88;
}

.typing{
  display:none;
  align-self:flex-start;
  background:#062b1d;
  color:#00ff88;
  padding:10px 14px;
  border-radius:10px;
  font-size:13px;
  margin:0 15px 10px;
  border:1px solid #00ff88;
  box-shadow:0 0 10px #00ff8840;
}

.input-area{
  display:flex;
  gap:8px;
  padding:10px;
  background:#080808;
  border-top:1px solid #00ffff;
}

input{
  flex:1;
  border:1px solid #00ffff;
  outline:none;
  padding:13px 16px;
  border-radius:25px;
  font-size:15px;
  background:#111;
  color:white;
  box-shadow:0 0 8px #00ffff40;
}

input:focus{
  border-color:#ff00ff;
  box-shadow:0 0 12px #ff00ff80;
}

input::placeholder{
  color:#777;
}

button{
  width:48px;
  height:48px;
  border:none;
  border-radius:50%;
  background:#ff003c;
  color:white;
  font-size:20px;
  cursor:pointer;
  box-shadow:0 0 12px #ff003c;
  transition:.2s;
}

button:hover{
  background:#ff0055;
  box-shadow:0 0 20px #ff003c;
}

button:active{
  transform:scale(.95);
}

@media(max-width:430px){
  .chat{
    max-height:none;
  }
}
</style>
</head>

<body>

<div class="chat">

  <div class="header">
    <div class="avatar">
      <img
        src="https://i.ibb.co/G4sHV2cW/20260822-000544.jpg"
        alt="Ohid bby Ai"
      >
    </div>

    <div>
      <h3>Ohid bby Ai</h3>
      <small>● Online</small>
    </div>
  </div>

  <div class="messages" id="messages">

    <div class="message bot">
      আসসালামু আলাইকুম! 👋
      <br>আমি Ohid bby Ai 🤖
      <br>আমাকে কিছু জিজ্ঞেস করো।
      <span class="time">এখন</span>
    </div>

  </div>

  <div class="typing" id="typing">
    AI লিখছে...
  </div>

  <div class="input-area">
    <input
      type="text"
      id="input"
      placeholder="মেসেজ লিখুন..."
      autocomplete="off"
    >
    <button id="send">➤</button>
  </div>

</div>

<script>
/* =========================================
   FREE.AI API KEY
   এখানে তোমার নিজের API key বসাও
   ========================================= */

const API_KEY = "sk-free-92bbdc964fb8b4e77c18c40d5bc6bae07df5b20bc87abb4f";

const API_URL = "https://api.free.ai/v1/chat/";
const MODEL = "qwen7b";

const input = document.getElementById("input");
const send = document.getElementById("send");
const messages = document.getElementById("messages");
const typing = document.getElementById("typing");

function getTime(){
  return new Date().toLocaleTimeString("bn-BD",{
    hour:"2-digit",
    minute:"2-digit"
  });
}

function addMessage(text,type){
  const div = document.createElement("div");
  div.className = "message " + type;

  const content = document.createElement("span");
  content.textContent = text;

  const time = document.createElement("span");
  time.className = "time";
  time.textContent = getTime();

  div.appendChild(content);
  div.appendChild(time);

  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

async function sendMessage(){

  const text = input.value.trim();

  if(!text) return;

  addMessage(text,"user");
  input.value = "";

  typing.style.display = "block";
  send.disabled = true;

  try{

    const response = await fetch(API_URL,{
      method:"POST",

      headers:{
        "Authorization":"Bearer " + API_KEY,
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        model:MODEL,

        messages:[
          {
            role:"system",
            content:"You are Ohid bby Ai. Reply helpfully in Bengali when appropriate."
          },
          {
            role:"user",
            content:text
          }
        ]
      })
    });

    const data = await response.json();

    if(!response.ok){
      throw new Error(
        data.error?.message || "API request failed"
      );
    }

    const reply =
      data.choices?.[0]?.message?.content;

    addMessage(
      reply || "দুঃখিত, কোনো উত্তর পাওয়া যায়নি।",
      "bot"
    );

  }catch(error){

    addMessage(
      "API Error: " + error.message,
      "bot"
    );

  }finally{

    typing.style.display = "none";
    send.disabled = false;
    input.focus();

  }
}

send.addEventListener("click",sendMessage);

input.addEventListener("keydown",function(e){
  if(e.key === "Enter"){
    sendMessage();
  }
});
</script>

</body>
</html>
