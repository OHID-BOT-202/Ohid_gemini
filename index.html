<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baby GPT Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 520px;
      height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
      background: #050505;
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      background: #080808;
      border-bottom: 1px solid #00ff66;
      box-shadow: 0 0 18px #00ff6644;
    }

    .profile {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #00ff66;
      box-shadow: 0 0 15px #00ff66;
    }

    .bot-name {
      color: #00ff66;
      font-size: 20px;
      font-weight: bold;
    }

    .status {
      margin-top: 4px;
      color: #aaa;
      font-size: 12px;
    }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 18px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 85%;
      padding: 11px 14px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .bot {
      align-self: flex-start;
      color: #00ff66;
      background: #061b0d;
      border: 1px solid #00ff66;
      border-bottom-left-radius: 4px;
      box-shadow: 0 0 9px #00ff6633;
    }

    .user {
      align-self: flex-end;
      color: #ff4040;
      background: #260606;
      border: 1px solid #ff2222;
      border-bottom-right-radius: 4px;
      box-shadow: 0 0 9px #ff222233;
    }

    .typing {
      display: none;
      align-self: flex-start;
      padding: 7px 12px;
      color: #00ff66;
      font-size: 13px;
      font-style: italic;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #080808;
      border-top: 1px solid #222;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      padding: 13px 16px;
      border: 1px solid #00ff66;
      border-radius: 25px;
      outline: none;
      background: #000;
      color: white;
      font-size: 15px;
    }

    #messageInput::placeholder {
      color: #777;
    }

    #messageInput:focus {
      box-shadow: 0 0 12px #00ff6655;
    }

    #sendBtn {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      background: #ff2222;
      color: #fff;
      font-size: 21px;
      cursor: pointer;
      box-shadow: 0 0 14px #ff2222;
    }

    #sendBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .error {
      color: #ff5555;
    }

    @media (max-width: 600px) {
      .message {
        max-width: 90%;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <img
        class="profile"
        src="https://i.ibb.co/G4sHV2cW/20260822-000544.jpg"
        alt="GPT Profile"
      >

      <div>
        <div class="bot-name">Baby GPT</div>
        <div class="status">Online • AI Assistant</div>
      </div>
    </div>

    <div class="chat-box" id="chatBox">

      <div class="message bot">
        হ্যালো! আমি Baby GPT 🤖
        আমাকে যেকোনো প্রশ্ন করতে পারো।
      </div>

      <div class="typing" id="typing">
        Baby GPT লিখছে...
      </div>

    </div>

    <form class="input-area" id="chatForm">
      <input
        type="text"
        id="messageInput"
        placeholder="মেসেজ লিখুন..."
        autocomplete="off"
        required
      >

      <button type="submit" id="sendBtn">➤</button>
    </form>

  </div>

  <script>
    const API_SERVER_URL =
      "https://sensui-useless-apis.codersensui.repl.co/api/tools/ai";

    const chatForm = document.getElementById("chatForm");
    const chatBox = document.getElementById("chatBox");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const typing = document.getElementById("typing");

    function addMessage(text, type) {
      const message = document.createElement("div");

      message.className = "message " + type;
      message.textContent = text;

      chatBox.insertBefore(message, typing);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showTyping() {
      typing.style.display = "block";
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function hideTyping() {
      typing.style.display = "none";
    }

    async function sendMessage(question) {
      addMessage(question, "user");

      messageInput.value = "";
      sendBtn.disabled = true;
      showTyping();

      try {
        const apiUrl =
          API_SERVER_URL +
          "?question=" +
          encodeURIComponent(question);

        const response = await fetch(apiUrl);

        if (!response.ok) {
          throw new Error("API server error");
        }

        const data = await response.json();

        hideTyping();

        if (data.error) {
          addMessage(
            "AI এখন উত্তর দিতে পারছে না। পরে আবার চেষ্টা করো।",
            "bot"
          );
          return;
        }

        const answer = data.answer;

        if (answer) {
          addMessage(answer, "bot");
        } else {
          addMessage(
            "কোনো উত্তর পাওয়া যায়নি।",
            "bot"
          );
        }

      } catch (error) {
        hideTyping();

        addMessage(
          "API কাজ করছে না। সার্ভার বন্ধ থাকতে পারে অথবা CORS সমস্যা হয়েছে।",
          "bot"
        );

        console.error("GPT Error:", error);

      } finally {
        sendBtn.disabled = false;
        messageInput.focus();
      }
    }

    chatForm.addEventListener("submit", function(event) {
      event.preventDefault();

      const question = messageInput.value.trim();

      if (question !== "") {
        sendMessage(question);
      }
    });
  </script>

</body>
</html>
